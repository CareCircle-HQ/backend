# Main CRM vhost — mirrors what is deployed at /etc/nginx/sites-enabled/.
# Kept in the repo so the deployed config is reviewable and reproducible.
#
# TLS terminates UPSTREAM at the ALB, hence `listen 80` and $forwarded_proto.

# http{} level — keep ABOVE the server blocks. Both are defined once and shared
# across every included file; nginx rejects a duplicate definition.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# Request TIMING, which the default `combined` format omits entirely. During the
# 2026-09-14 incident a single endpoint held workers for up to 15 minutes and the
# access log could not show it -- the duration had to be reconstructed from
# ImportRun rows afterwards.
#
#   rt  = total time nginx spent on the request
#   urt = time waiting on gunicorn (rt - urt is nginx's own overhead/buffering)
#
# $uri, NOT $request or $request_uri: the query string is deliberately dropped.
# Members-list search puts MEMBER NAMES in it, and there is no operational reason
# to accumulate those in logs (or to ship them to CloudWatch).
log_format timed '$remote_addr $host "$request_method $uri" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

# Catch-all for any Host we do not recognise: probes hitting the ALB or the
# instance by IP address. Explicitly the default server so this never depends on
# which file nginx happens to load first.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # The ALB health check is `GET /` with the instance's private IP as the Host,
    # so it lands HERE. It is answered by nginx on purpose: previously it was
    # proxied to Django's root view, which meant worker exhaustion would fail the
    # health check and pull the only target out of service -- turning slowness
    # into a full outage. Trade-off: this proves nginx is alive, not Django.
    # Correct for a single instance; revisit if a second is ever added.
    location = / {
        access_log off;
        return 200 'ok';
    }

    # Everything else with an unknown Host is dropped without a response.
    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name carecircleinternal.com www.carecircleinternal.com;

    access_log /var/log/nginx/access.log timed;

    client_max_body_size 200M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /static/ {
        alias /home/ubuntu/backend/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/home/ubuntu/backend/gunicorn.sock;

        # Set each header ONCE (do not also include proxy_params here).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# Find the slowest requests once `timed` is live:
#
#   awk '{for(i=1;i<=NF;i++) if($i ~ /^rt=/) print substr($i,4), $0}' \
#       /var/log/nginx/access.log | sort -rn | head -20
