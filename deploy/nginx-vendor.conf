# Vendor portal vhost — the PWA and its API, on one hostname.
#
#   Install:  sudo cp deploy/nginx-vendor.conf \
#                  /etc/nginx/sites-available/vendor
#             sudo ln -s /etc/nginx/sites-available/vendor \
#                        /etc/nginx/sites-enabled/vendor
#             sudo nginx -t && sudo systemctl reload nginx
#
# See docs/vendor-portal-plan.md. This is the FIRST of three isolation layers; the
# second is api.middleware.VendorHostMiddleware (serves only api.vendor.urls on
# this hostname) and the third is that the vendor auth class is absent from
# DEFAULT_AUTHENTICATION_CLASSES. Any one would do the job; three means a single
# misconfiguration cannot expose the CRM.
#
# A SEPARATE hostname from partners.carecircleinternal.com, deliberately: a
# delivery company's machine credential and a vendor employee's session token must
# never be presentable to the same surface.
#
# App AND API on one host so the PWA is same-origin with its API — no CORS, no
# preflight on every request, and one certificate.
#
# Mirrors the main `carecircle` vhost: TLS terminates UPSTREAM (hence listen 80 and
# the $forwarded_proto map), and gunicorn is reached over its unix socket.
#
# NB: $forwarded_proto is defined once in the `carecircle` vhost. `map` is
# http{}-level and shared across included files, so do NOT redefine it here —
# nginx rejects a duplicate.

server {
    listen 80;
    server_name vendor.carecircleinternal.com;

    # Don't advertise the nginx version to third parties.
    server_tokens off;

    # Photos go device -> S3 directly via a presigned PUT, so the large bodies
    # never traverse nginx. This ceiling exists for the multipart fallback and to
    # keep an oversized upload landing on our JSON error rather than an nginx
    # HTML 413.
    client_max_body_size 30m;
    client_body_timeout  120s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # Separate logs: this is third-party traffic from unmanaged devices and worth
    # watching on its own.
    access_log /var/log/nginx/vendor.access.log;
    error_log  /var/log/nginx/vendor.error.log;

    # Where `npm run build` in vendor-app/ is deployed.
    root /var/www/vendor-app;
    index index.html;

    # ── the API ──────────────────────────────────────────────────────────────
    # The ONLY prefix that reaches Django on this hostname.
    location /v1/ {
        proxy_pass http://unix:/home/ubuntu/backend/gunicorn.sock;

        # Host must reach Django unchanged: VendorHostMiddleware matches on it to
        # select the vendor URLConf. Rewriting it would serve the CRM.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Real client IP -> login audit trail and rate limiting.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── the app ──────────────────────────────────────────────────────────────
    # NEVER cache the service worker or the entry document. A stale service worker
    # pins an old app version on a device indefinitely, and the plan's "forced app
    # update" requirement is unenforceable if the browser is holding yesterday's
    # copy — a vendor would keep submitting against a retired form template.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames under /assets/, so these are immutable:
    # a changed file gets a new name, and nothing else can go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Any other path serves the app shell so client-side routing
    # works on a cold load or a home-screen launch.
    #
    # Note this deliberately does NOT fall through to Django: a CRM path such as
    # /api/clients/ gets the app shell here, never the CRM. Combined with the
    # URLConf swap, there is no route from this hostname to CRM data.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
