# Delivery-partner API vhost — proof-of-delivery ingestion only.
#
#   Install:  sudo cp deploy/nginx-partners-api.conf \
#                  /etc/nginx/sites-available/partners-api
#             sudo ln -s /etc/nginx/sites-available/partners-api \
#                        /etc/nginx/sites-enabled/partners-api
#             sudo nginx -t && sudo systemctl reload nginx
#
# See docs/delivery_partner_api_plan.md §7. This is the FIRST of two isolation
# layers; the second is api.middleware.PartnerHostMiddleware, which serves only
# api.partner.urls on this hostname. Either alone would do the job — both means a
# single misconfiguration cannot expose the CRM.
#
# Mirrors the main `carecircle` vhost: TLS terminates UPSTREAM (hence listen 80
# and the $forwarded_proto map), and gunicorn is reached over its unix socket.
# The partner hostname must therefore also be added to the upstream TLS
# terminator's certificate / listener rules.
#
# NB: $forwarded_proto is defined once in the `carecircle` vhost. `map` is
# http{}-level and shared across included files, so do NOT redefine it here —
# nginx rejects a duplicate.

server {
    listen 80;
    server_name partners.carecircleinternal.com;

    # Don't advertise the nginx version to third parties.
    server_tokens off;

    # Proof images are capped at 25 MB in the app; leave slack for the multipart
    # envelope. Keep this ABOVE the app limit so an oversized upload gets our
    # JSON error instead of an nginx HTML 413.
    client_max_body_size 30m;
    client_body_timeout  120s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # Separate logs: partner traffic is third-party and worth watching on its own.
    access_log /var/log/nginx/partners-api.access.log;
    error_log  /var/log/nginx/partners-api.error.log;

    # The ONLY routable prefix on this hostname.
    location /v1/ {
        proxy_pass http://unix:/home/ubuntu/backend/gunicorn.sock;

        # Host must reach Django unchanged: PartnerHostMiddleware matches on it
        # to select the partner URLConf. Rewriting it would serve the CRM.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Real client IP -> per-credential IP allowlist + audit trail.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Everything else — /api/, /admin/, /static/, / — dies here, before Django.
    # Note there is deliberately NO /static/ alias on this vhost: partners have
    # no UI, so none of our assets should be reachable from this hostname.
    location / {
        default_type application/json;
        return 404 '{"error":"not_found","detail":"Unknown endpoint."}';
    }
}
